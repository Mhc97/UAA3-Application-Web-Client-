<div class="dashboard-container">
  <h1>Dashboard Médecin</h1>

  <section class="card">
    <h2>Mes Rendez-vous</h2>

    @if (rendezvous.length === 0) {
      <p>Aucun rendez-vous</p>
    } @else {
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Heure</th>
            <th>Patient</th>
            <th>État</th>
          </tr>
        </thead>
        <tbody>
          @for (r of rendezvous; track r.id) {
            <tr>
              <td>{{ r.date | dateFormat }}</td>
              <td>{{ r.heure }}</td>
              <td>{{ getPatientName(r.patientId) }}</td>
              <td>{{ r.etat }}</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </section>
</div>
